version: 1
project: specos-ai
purpose: Spec-driven AI IDE orchestration

defaults:
  language: zh-CN
  output_style: concise
  require_traceability: true
  require_open_questions: true
  protect_human_authored_files: true

context_order:
  - readme.md
  - README.md
  - .rules/project.md
  - rules/
  - docs/spec-modes/
  - .requirements/
  - design/
  - ai/agents/

calling_convention:
  selection_source: .agents/manifest.yaml
  role_path_base: .agents/
  canonical_path_base: repository root
  mode_overlay_roots:
    role_overlays: .agents/modes/
    canonical_overlays: ai/agents/modes/
  prompt_assembly_order:
    - AGENTS.md
    - .codex/instructions.md
    - .specos/manifest.yaml projectMode
    - selected role metadata from .agents/manifest.yaml
    - selected mode overlay manifest from .agents/modes/<projectMode>/manifest.overlay.yaml
    - selected shared role_prompt
    - selected shared canonical
    - selected mode overlay role_prompt when present
    - selected mode overlay canonical when present
    - selected skills
    - selected context_includes
  routing_rules:
    - Only load the selected role's role_prompt, canonical, skills, and context_includes.
    - Do not preload repository or external skills unless they are declared on the selected role.
    - Prefer switching agents or splitting issues over broadening one agent's skill set.
    - Roles with empty skills run as role-and-rules-only agents.
    - Do not invent ad-hoc roles; main primary and specialist agents must be registered in this manifest.
    - "User-facing routing targets only tier: main agents: architecture-agent, implementation-agent, testing-agent, and qa-agent; pola coordinates across them."
    - "Roles with tier: specialist are never default entrypoints; open them as on-demand subagents through their managed_by main agent."
    - Treat route-request and classify-request as routing previews, not agent execution.
    - route-request and classify-request should resolve projectMode first, then expose the resulting overlay manifest and role prompt load order.
    - For nested host-side dispatch, use pola as coordinator and follow ai/workflows/nested-agent-orchestration.md.
    - Route raw idea, one-line requirement, and product intake requests to architecture-agent, which opens product-architect-agent for /prd before spec-editor runs /prd-to-spec.
    - Shared prompts are the default backbone; mode overlay prompts add only the selected mode's differences.

mode_overlays:
  litespec:
    manifest_overlay: .agents/modes/litespec/manifest.overlay.yaml
    purpose: Feature-driven, low-token, daily delivery mode.
  goalspec:
    manifest_overlay: .agents/modes/goalspec/manifest.overlay.yaml
    purpose: Workflow-driven mode where an approved Feature Spec branches into implementation Issues and version-bound Test Spec verification before review and ship.
  enterprisespec:
    manifest_overlay: .agents/modes/enterprisespec/manifest.overlay.yaml
    purpose: Governed delivery mode with stronger QA, release, and audit evidence requirements.

coordinator:
  name: pola
  tier: coordinator
  purpose: Classify the request, route it to one of the four main agents, merge specialist reports, and keep the final answer as one consolidated recommendation.
  routes_to:
    - architecture-agent
    - implementation-agent
    - testing-agent
    - qa-agent
  owns:
    - request intake and classification
    - routing preview and dispatch boundaries
    - report merge and final synthesis
  constraints:
    - pola is not a dispatchable execution role.
    - Cross-main handoffs go through pola, not direct main-to-main delegation.

roles:
  architecture-agent:
    role_prompt: roles/architecture-agent.md
    canonical: ai/agents/architecture-agent.md
    tier: main
    skill_mode: scoped_only
    skills:
      - name: codebase-design
        path: skills/developer/codebase-design/SKILL.md
        required: false
        purpose: Deep-module boundaries, interfaces, seams, and architecture vocabulary.
      - name: design-an-interface
        path: skills/developer/design-an-interface/SKILL.md
        required: false
        purpose: Compare radically different module and API interface designs.
      - name: domain-modeling
        path: skills/developer/domain-modeling/SKILL.md
        required: false
        purpose: Domain terminology, boundaries, invariants, and ADR support.
    delegates_to:
      - product-architect-agent
      - spec-editor
      - ddd-domain-agent
      - openapi-agent
      - db-migration-agent
      - ui-design-agent
      - test-editor
      - performance-test-agent
      - concurrency-test-agent
      - reviewer
    context_includes:
      - .rules/project.md
      - docs/spec-modes/
      - design/
      - ai/workflows/nested-agent-orchestration.md
      - .requirements/
    owns:
      - architecture decision synthesis
      - cross-surface impact boundaries
      - main-agent delegation plan
    outputs:
      - architecture recommendation
      - delegated specialist task list
      - assumptions and unresolved questions

  implementation-agent:
    role_prompt: roles/implementation-agent.md
    canonical: ai/agents/implementation-agent.md
    tier: main
    skill_mode: scoped_only
    skills:
      - name: karpathy-guidelines
        path: skills/developer/karpathy-guidelines/SKILL.md
        required: false
        purpose: Keep implementation changes small, explicit, and verifiable.
      - name: diagnosing-bugs
        path: skills/developer/diagnosing-bugs/SKILL.md
        required: false
        purpose: Root-cause diagnosis for failures and performance regressions.
      - name: tdd
        path: skills/developer/tdd/SKILL.md
        required: false
        purpose: Implementation-coupled test-first delivery at agreed seams.
      - name: refactor
        path: skills/developer/refactor/SKILL.md
        required: false
        purpose: Behavior-preserving code restructuring.
    delegates_to:
      - frontend-agent
      - backend-agent
      - implementation-editor
      - execution-editor
      - ui-design-agent
      - openapi-agent
      - db-migration-agent
      - unit-test-agent
      - specialized-check-agent
    context_includes:
