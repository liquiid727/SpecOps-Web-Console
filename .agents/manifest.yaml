version: 1
project: specos-ai
purpose: Spec-driven AI IDE orchestration

defaults:
  language: zh-CN
  output_style: concise
  require_traceability: true
  require_open_questions: true
  protect_human_authored_files: true

context_order:
  - readme.md
  - README.md
  - .rules/project.md
  - rules/
  - spec-draft/
  - specs/current/project-context.md
  - specs/current/architecture-context.md
  - specs/current/domain-context.md
  - specs/current/
  - specs/changes/
  - tests/
  - ai/agents/

calling_convention:
  selection_source: .agents/manifest.yaml
  role_path_base: .agents/
  canonical_path_base: repository root
  prompt_assembly_order:
    - AGENTS.md
    - .codex/instructions.md
    - selected role metadata from .agents/manifest.yaml
    - selected role_prompt
    - selected canonical
    - selected skills
    - selected context_includes
  routing_rules:
    - Only load the selected role's role_prompt, canonical, skills, and context_includes.
    - Do not preload repository or external skills unless they are declared on the selected role.
    - Prefer switching agents or splitting tasks over broadening one agent's skill set.
    - Roles with empty skills run as role-and-rules-only agents.

roles:
  product-architect-agent:
    role_prompt: roles/product-architect-agent.md
    canonical: ai/agents/product-architect-agent.md
    skill_mode: scoped_only
    skills:
      - name: product-architect
        path: spec-web-ui/catalog/skills/product-architect/SKILL.md
        required: true
        purpose: Convert raw product ideas into a Spec blueprint with Product, Architecture, Database, API, and UI branches, then derive Task, Code, Test, and Deploy handoffs.
    context_includes:
      - .rules/project.md
      - specs/current/project-context.md
      - specs/current/architecture-context.md
      - specs/current/domain-context.md
      - spec-draft/
      - spec-web-ui/catalog/spec-templates/template-prd-draft/
      - spec-web-ui/catalog/spec-templates/template-spec-blueprint-yaml/
      - spec-web-ui/catalog/spec-templates/template-product-spec-yaml/
      - spec-web-ui/catalog/spec-templates/template-feature-draft/
    owns:
      - spec-draft/
      - product draft notes
      - agent handoff notes
    outputs:
      - Spec Blueprint
      - Product branch notes
      - Architecture branch notes
      - Database branch notes
      - API branch notes
      - UI branch notes
      - Task, Code, Test, and Deploy handoff plan
      - assumptions and unresolved questions

  spec-editor:
    role_prompt: roles/spec-editor.md
    canonical: ai/agents/spec-editor.md
    skill_mode: scoped_only
    skills: []
    context_includes:
      - .rules/project.md
      - specs/_rules/README.md
      - spec-draft/
      - specs/current/
      - specs/changes/
      - tests/
    owns:
      - spec-draft/
      - specs/current/
      - specs/changes/
    outputs:
      - normalized spec bundle
      - assumptions and unresolved questions

  frontend-agent:
    role_prompt: roles/frontend-agent.md
    canonical: ai/agents/frontend-agent.md
    skill_mode: scoped_only
    skills: []
    context_includes:
      - .rules/project.md
      - rules/frontend/react-workbench-delivery.md
      - rules/ui/pencil-prototype-ui.md
      - specs/current/
      - specs/changes/
      - spec-web-ui/
    owns:
      - frontend implementation plan
      - UI state coverage
      - frontend specialist handoff
    outputs:
      - frontend plan
      - UI state coverage notes
      - specialist routing notes
      - frontend risks and open questions

  backend-agent:
    role_prompt: roles/backend-agent.md
    canonical: ai/agents/backend-agent.md
    skill_mode: scoped_only
    skills: []
    context_includes:
      - .rules/project.md
      - rules/backend/go-backend-governance.md
      - rules/shared/error-code-governance.md
      - specs/current/
      - specs/changes/
      - tests/
    owns:
