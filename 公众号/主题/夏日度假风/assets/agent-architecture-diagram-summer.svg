    <ellipse cx="150" cy="56" rx="40" ry="17"/>
    <ellipse cx="185" cy="50" rx="28" ry="13"/>
  </g>

  <!-- sand foreground band, wavy top -->
  <path d="M0 880 Q60 860 120 880 T240 880 T360 880 T480 880 T600 880 T720 880 T840 880 T960 880 T1080 880 T1200 880 L1240 980 L0 980 Z" fill="url(#sand2)"/>

