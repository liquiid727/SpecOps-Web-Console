  </defs>

  <rect width="1240" height="980" fill="url(#sky2)"/>

  <!-- sun -->
  <circle cx="1150" cy="66" r="34" fill="#FFC66B"/>
  <circle cx="1150" cy="66" r="34" fill="#FFB347" opacity="0.5"/>

