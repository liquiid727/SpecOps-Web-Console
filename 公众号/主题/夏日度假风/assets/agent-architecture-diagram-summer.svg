  <text x="285" y="267" fill="#227C9D" font-size="13.5" text-anchor="middle" font-weight="700">🌊 mode overlay</text>
  <text x="285" y="286" fill="#3E5560" font-size="11.5" text-anchor="middle">.agents/modes/&lt;mode&gt;/</text>
  <text x="285" y="303" fill="#3E5560" font-size="11.5" text-anchor="middle">manifest.overlay.yaml（只放差异）</text>

