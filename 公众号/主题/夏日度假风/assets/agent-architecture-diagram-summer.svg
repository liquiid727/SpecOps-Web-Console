  <path d="M620 496 q-16 16 0 32" stroke="#3BAFDA" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M620 496 q16 16 0 32" stroke="#3BAFDA" stroke-width="2.5" fill="none" stroke-linecap="round"/>

