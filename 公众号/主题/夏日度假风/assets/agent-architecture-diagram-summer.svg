  <text x="620" y="267" fill="#227C9D" font-size="13.5" text-anchor="middle" font-weight="700">🐚 共享角色</text>
  <text x="620" y="286" fill="#3E5560" font-size="11.5" text-anchor="middle">.agents/roles/ + ai/agents/</text>
  <text x="620" y="303" fill="#3E5560" font-size="11.5" text-anchor="middle">～15 个基础 role prompt</text>

  <g filter="url(#ss)"><rect x="790" y="240" width="330" height="88" rx="18" fill="#FFF2D8" stroke="#FFB347" stroke-width="2"/></g>
  <text x="955" y="267" fill="#C97A17" font-size="13.5" text-anchor="middle" font-weight="700">🍍 技能目录</text>
  <text x="955" y="286" fill="#7A5A2E" font-size="11.5" text-anchor="middle">.skills/*/SKILL.md</text>
  <text x="955" y="303" fill="#7A5A2E" font-size="11.5" text-anchor="middle">～19 个技能折叠进对应 agent</text>

  <path d="M285 328 q-20 20 0 40" stroke="#3BAFDA" stroke-width="2.5" fill="none" stroke-linecap="round"/>
