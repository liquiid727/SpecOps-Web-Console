  <g filter="url(#ss)"><rect x="120" y="546" width="480" height="100" rx="18" fill="#EAF8FF" stroke="#6EC6FF" stroke-width="2"/></g>
  <text x="360" y="574" fill="#227C9D" font-size="13.5" text-anchor="middle" font-weight="700">🏄 主 Agent（4 选 1）</text>
  <text x="360" y="596" fill="#3E5560" font-size="11.5" text-anchor="middle">architecture / implementation</text>
  <text x="360" y="614" fill="#3E5560" font-size="11.5" text-anchor="middle">deployment / testing</text>
  <text x="360" y="632" fill="#6B7A86" font-size="10.5" text-anchor="middle">决定"这是谁的活"</text>

  <g filter="url(#ss)"><rect x="640" y="546" width="480" height="100" rx="18" fill="#FFE7EC" stroke="#FF8FA3" stroke-width="2"/></g>
  <text x="880" y="574" fill="#D9506B" font-size="13.5" text-anchor="middle" font-weight="700">🍹 Specialist Agent（2~4 个）</text>
  <text x="880" y="596" fill="#8A4A56" font-size="11.5" text-anchor="middle">spec-editor / ddd-domain / openapi</text>
  <text x="880" y="614" fill="#8A4A56" font-size="11.5" text-anchor="middle">db-migration / qa-agent / reviewer …</text>
  <text x="880" y="632" fill="#6B7A86" font-size="10.5" text-anchor="middle">带边界的具体问题，不整段丢报告</text>

  <path d="M620 646 q-16 16 0 32" stroke="#3BAFDA" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M620 646 q16 16 0 32" stroke="#3BAFDA" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <text x="620" y="708" fill="#227C9D" font-size="14.5" text-anchor="middle" font-weight="700">🚩 CI 门禁（rules/ci/spec-release-gates.md）</text>

