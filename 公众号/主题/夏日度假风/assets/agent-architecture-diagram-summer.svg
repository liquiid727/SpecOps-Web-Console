  <line x1="90" y1="798" x2="90" y2="826" stroke="#8A5A2E" stroke-width="4" stroke-linecap="round"/>
  <text x="210" y="754" fill="#227C9D" font-size="12" text-anchor="middle" font-weight="700">PR Fast Gate</text>
