    <polygon points="1020,104 1036,104 1028,124" fill="#FFB347"/>
  </g>

  <!-- Row 1 -->
  <g filter="url(#ss)"><rect x="440" y="140" width="360" height="62" rx="18" fill="#FFFFFF" stroke="#6EC6FF" stroke-width="2"/></g>
  <text x="620" y="165" fill="#227C9D" font-size="14.5" text-anchor="middle" font-weight="700">🗺 .specos/manifest.yaml</text>
  <text x="620" y="185" fill="#6B7A86" font-size="12" text-anchor="middle">projectMode: lite / goal / enterprise</text>

  <path d="M620 202 q-16 16 0 32" stroke="#3BAFDA" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M620 202 q16 16 0 32" stroke="#3BAFDA" stroke-width="2.5" fill="none" stroke-linecap="round"/>

