  <g filter="url(#ss)"><rect x="360" y="728" width="260" height="70" rx="14" fill="#FFFFFF" stroke="#FFB347" stroke-width="2"/></g>
  <line x1="370" y1="798" x2="370" y2="826" stroke="#8A5A2E" stroke-width="4" stroke-linecap="round"/>
  <text x="490" y="754" fill="#C97A17" font-size="12" text-anchor="middle" font-weight="700">Change Verification Gate</text>
  <text x="490" y="772" fill="#6B7A86" font-size="10.5" text-anchor="middle">validate-test-gates 校验</text>

  <g filter="url(#ss)"><rect x="640" y="728" width="260" height="70" rx="14" fill="#FFFFFF" stroke="#FF8FA3" stroke-width="2"/></g>
  <line x1="650" y1="798" x2="650" y2="826" stroke="#8A5A2E" stroke-width="4" stroke-linecap="round"/>
  <text x="770" y="754" fill="#D9506B" font-size="12" text-anchor="middle" font-weight="700">Release Gate</text>
  <text x="770" y="772" fill="#6B7A86" font-size="10.5" text-anchor="middle">全量 E2E / 性能 / 并发</text>

  <g filter="url(#ss)"><rect x="920" y="728" width="240" height="70" rx="14" fill="#FFFFFF" stroke="#FF8FA3" stroke-width="2"/></g>
  <line x1="930" y1="798" x2="930" y2="826" stroke="#8A5A2E" stroke-width="4" stroke-linecap="round"/>
  <text x="1040" y="754" fill="#D9506B" font-size="12" text-anchor="middle" font-weight="700">Promote Gate</text>
  <text x="1040" y="772" fill="#6B7A86" font-size="10.5" text-anchor="middle">qa-agent 验收 + sync handoff</text>

  <path d="M340 763 Q350 780 360 763" stroke="#3BAFDA" stroke-width="2" fill="none" stroke-dasharray="1 6" stroke-linecap="round"/>
  <path d="M620 763 Q630 780 640 763" stroke="#3BAFDA" stroke-width="2" fill="none" stroke-dasharray="1 6" stroke-linecap="round"/>
  <path d="M900 763 Q910 780 920 763" stroke="#3BAFDA" stroke-width="2" fill="none" stroke-dasharray="1 6" stroke-linecap="round"/>

  <!-- sticky note in the sand -->
  <g filter="url(#ss)" transform="rotate(-2 620 880)">
    <rect x="120" y="838" width="1000" height="84" rx="14" fill="#FFF2D8" stroke="#FFB347" stroke-dasharray="7 5" stroke-width="1.5"/>
  </g>
  <text x="620" y="868" fill="#C97A17" font-size="13.5" text-anchor="middle" font-weight="700" transform="rotate(-2 620 868)">🍹 现状缺口便签</text>
  <text x="620" y="888" fill="#7A5A2E" font-size="12" text-anchor="middle" transform="rotate(-2 620 888)">四级门禁 + validate-test-gates 已经设计并可本地执行，但尚未接入 .github/workflows</text>
  <text x="620" y="906" fill="#7A5A2E" font-size="12" text-anchor="middle" transform="rotate(-2 620 906)">目前仓库里唯一的 Actions 是发包用的 publish-packages.yml，PR 上还不会自动触发 spec 门禁</text>

  <!-- footprints trail across sand -->
  <g fill="#8A5A2E" opacity="0.35">
    <ellipse cx="960" cy="950" rx="6" ry="10" transform="rotate(15 960 950)"/>
    <ellipse cx="978" cy="962" rx="6" ry="10" transform="rotate(-10 978 962)"/>
    <ellipse cx="996" cy="950" rx="6" ry="10" transform="rotate(15 996 950)"/>
