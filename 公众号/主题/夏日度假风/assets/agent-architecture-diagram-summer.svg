  <text x="60" y="46" fill="#227C9D" font-size="23" font-weight="800">Agent 编排 &amp; CI 门禁链路 🏖️</text>
  <text x="60" y="72" fill="#4A6570" font-size="14">manifest 解析模式 → 共享角色+技能折叠 → pola 协调派单 → 分级 CI 门禁</text>

  <!-- bunting string across the top of the flow -->
  <path d="M120 108 Q680 70 1120 108" stroke="#D9506B" stroke-width="3" fill="none" stroke-dasharray="2 8" stroke-linecap="round" opacity="0.7"/>
  <g>
