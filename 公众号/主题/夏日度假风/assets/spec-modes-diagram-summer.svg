<svg viewBox="0 0 1200 680" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#BDE8FF"/>
      <stop offset="60%" stop-color="#E8F7FF"/>
      <stop offset="100%" stop-color="#FFF6E3"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7ED2F0"/>
      <stop offset="100%" stop-color="#3BAFDA"/>
    </linearGradient>
    <linearGradient id="sand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFE9B8"/>
      <stop offset="100%" stop-color="#FFD98F"/>
    </linearGradient>
    <linearGradient id="cardLite" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#D8F1FF"/>
    </linearGradient>
    <linearGradient id="cardGoal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FFE4AE"/>
    </linearGradient>
    <linearGradient id="cardPro" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FFC9D6"/>
    </linearGradient>
    <filter id="softShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#2E3A46" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- sky -->
  <rect width="1200" height="680" fill="url(#sky)"/>

  <!-- sun with rays -->
  <g stroke="#FFB347" stroke-width="4" stroke-linecap="round" opacity="0.55">
    <line x1="1080" y1="20" x2="1080" y2="-6"/>
    <line x1="1130" y1="34" x2="1148" y2="16"/>
    <line x1="1150" y1="70" x2="1176" y2="62"/>
    <line x1="1030" y1="34" x2="1012" y2="16"/>
    <line x1="1010" y1="70" x2="984" y2="62"/>
  </g>
  <circle cx="1080" cy="70" r="42" fill="#FFC66B"/>
  <circle cx="1080" cy="70" r="42" fill="#FFB347" opacity="0.55"/>

  <!-- clouds -->
  <g fill="#FFFFFF" opacity="0.9">
    <ellipse cx="160" cy="70" rx="46" ry="20"/>
    <ellipse cx="200" cy="62" rx="34" ry="16"/>
    <ellipse cx="128" cy="62" rx="28" ry="14"/>
  </g>
  <g fill="#FFFFFF" opacity="0.7">
    <ellipse cx="650" cy="45" rx="34" ry="14"/>
    <ellipse cx="680" cy="40" rx="24" ry="11"/>
  </g>

  <!-- seagulls -->
  <path d="M300 120 q12 -14 24 0 q12 -14 24 0" stroke="#227C9D" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.6"/>
  <path d="M900 150 q10 -12 20 0 q10 -12 20 0" stroke="#227C9D" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.5"/>

  <!-- sea band with wavy top edge -->
  <path d="M0 190 Q60 170 120 190 T240 190 T360 190 T480 190 T600 190 T720 190 T840 190 T960 190 T1080 190 T1200 190 L1200 320 L0 320 Z" fill="url(#sea)" opacity="0.55"/>

  <!-- sand band with wavy top edge -->
  <path d="M0 300 Q60 280 120 300 T240 300 T360 300 T480 300 T600 300 T720 300 T840 300 T960 300 T1080 300 T1200 300 L1200 680 L0 680 Z" fill="url(#sand)"/>

  <!-- palm tree, bottom-left -->
  <g transform="translate(70,470)">
    <path d="M0 210 Q6 120 -4 40" stroke="#8A5A2E" stroke-width="10" fill="none" stroke-linecap="round"/>
    <g fill="#3BA896">
      <path d="M-4 40 Q-70 10 -110 55 Q-55 40 -4 40 Z"/>
      <path d="M-4 40 Q40 0 90 30 Q30 30 -4 40 Z"/>
      <path d="M-4 40 Q-40 -30 -20 -80 Q-10 -20 -4 40 Z"/>
      <path d="M-4 40 Q30 -30 70 -60 Q10 -10 -4 40 Z"/>
      <path d="M-4 40 Q-60 -40 -100 -20 Q-45 5 -4 40 Z"/>
    </g>
  </g>

  <text x="60" y="40" fill="#227C9D" font-size="26" font-weight="800">SpecOS 三档 Spec 模式</text>
  <text x="60" y="68" fill="#4A6570" font-size="14">从沙滩椅到度假别墅 —— LiteSpec → GoalSpec → EnterpriseSpec 🌴</text>

  <!-- towel cards on the sand -->
  <g filter="url(#softShadow)" transform="rotate(-3 260 490)">
    <rect x="120" y="430" width="280" height="120" rx="16" fill="url(#cardLite)" stroke="#6EC6FF" stroke-width="2.5"/>
    <g fill="#6EC6FF" opacity="0.9">
      <path d="M120 542 l14 8 l14 -8 l14 8 l14 -8 l14 8 l14 -8 l14 8 l14 -8 l14 8 l14 -8 l14 8 l14 -8 l14 8 l14 -8 l14 8 l14 -8 l14 8 l14 -8 l14 8 l14 -8 v8 h-280 z"/>
    </g>
  </g>
  <text x="260" y="410" fill="#227C9D" font-size="14" text-anchor="middle" letter-spacing="1">🕶 STEP 01</text>
  <text x="260" y="480" fill="#227C9D" font-size="23" font-weight="800" text-anchor="middle" transform="rotate(-3 260 480)">LiteSpec</text>
  <text x="260" y="504" fill="#5A6A75" font-size="13" text-anchor="middle" transform="rotate(-3 260 504)">Feature Driven</text>

  <g filter="url(#softShadow)">
    <rect x="460" y="330" width="280" height="220" rx="16" fill="url(#cardGoal)" stroke="#FFB347" stroke-width="2.5"/>
    <g fill="#FFB347" opacity="0.9">
      <path d="M460 542 l14 8 l14 -8 l14 8 l14 -8 l14 8 l14 -8 l14 8 l14 -8 l14 8 l14 -8 l14 8 l14 -8 l14 8 l14 -8 l14 8 l14 -8 l14 8 l14 -8 l14 8 l14 -8 v8 h-280 z"/>
    </g>
  </g>
  <text x="600" y="310" fill="#C97A17" font-size="14" text-anchor="middle" letter-spacing="1">🥥 STEP 02</text>
  <text x="600" y="378" fill="#C97A17" font-size="23" font-weight="800" text-anchor="middle">GoalSpec</text>
  <text x="600" y="402" fill="#7A5A2E" font-size="13" text-anchor="middle">Workflow Driven</text>

  <g filter="url(#softShadow)" transform="rotate(2 940 400)">
    <rect x="800" y="170" width="280" height="380" rx="16" fill="url(#cardPro)" stroke="#FF8FA3" stroke-width="2.5"/>
    <g fill="#FF8FA3" opacity="0.9">
      <path d="M800 542 l14 8 l14 -8 l14 8 l14 -8 l14 8 l14 -8 l14 8 l14 -8 l14 8 l14 -8 l14 8 l14 -8 l14 8 l14 -8 l14 8 l14 -8 l14 8 l14 -8 l14 8 l14 -8 v8 h-280 z"/>
    </g>
    <!-- umbrella on top of the tallest towel -->
    <g transform="translate(940,150)">
      <path d="M-50 0 Q0 -55 50 0 Z" fill="#FF8FA3"/>
      <path d="M-50 0 Q0 -55 50 0" fill="none" stroke="#D9506B" stroke-width="2"/>
      <line x1="0" y1="0" x2="0" y2="45" stroke="#8A5A2E" stroke-width="5" stroke-linecap="round"/>
    </g>
  </g>
  <text x="940" y="220" fill="#D9506B" font-size="14" text-anchor="middle" letter-spacing="1">🍹 STEP 03</text>
  <text x="940" y="288" fill="#D9506B" font-size="23" font-weight="800" text-anchor="middle">EnterpriseSpec</text>
  <text x="940" y="312" fill="#8A4A56" font-size="13" text-anchor="middle">Delivery Driven</text>

  <g font-size="12.5" fill="#5A6A75">
    <text x="260" y="565" text-anchor="middle" transform="rotate(-3 260 565)">一个 feature 一份 spec</text>
    <text x="600" y="575" text-anchor="middle">prd → to-issues → goal → review-it → ship-it</text>
    <text x="940" y="328" text-anchor="middle">categorized QA / 发布证据 · 4 级 CI 门禁</text>
  </g>

  <!-- footprints trail connecting the three towels -->
  <g fill="#8A5A2E" opacity="0.45">
    <ellipse cx="410" cy="600" rx="7" ry="11" transform="rotate(20 410 600)"/>
    <ellipse cx="430" cy="615" rx="7" ry="11" transform="rotate(-15 430 615)"/>
    <ellipse cx="450" cy="600" rx="7" ry="11" transform="rotate(20 450 600)"/>
    <ellipse cx="470" cy="615" rx="7" ry="11" transform="rotate(-15 470 615)"/>
    <ellipse cx="750" cy="610" rx="7" ry="11" transform="rotate(20 750 610)"/>
    <ellipse cx="770" cy="625" rx="7" ry="11" transform="rotate(-15 770 625)"/>
    <ellipse cx="790" cy="610" rx="7" ry="11" transform="rotate(20 790 610)"/>
  </g>

  <text x="1130" y="660" fill="#6B7A86" font-size="13" text-anchor="end">团队规模 / 治理重量 →</text>
  <text x="70" y="660" fill="#6B7A86" font-size="13">个人 / 5人内团队</text>
</svg>
