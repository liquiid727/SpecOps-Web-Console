<svg viewBox="0 0 1200 620" xmlns="http://www.w3.org/2000/svg" font-family="'SF Mono','JetBrains Mono',Consolas,monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f1720"/>
      <stop offset="100%" stop-color="#131c26"/>
    </linearGradient>
    <linearGradient id="stepLite" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5fd0c0"/>
      <stop offset="100%" stop-color="#3ba896"/>
    </linearGradient>
    <linearGradient id="stepGoal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8a94c"/>
      <stop offset="100%" stop-color="#c8862c"/>
    </linearGradient>
    <linearGradient id="stepPro" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d97a7a"/>
      <stop offset="100%" stop-color="#b74f4f"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="620" fill="url(#bg)"/>

  <text x="60" y="64" fill="#eef1e9" font-size="26" font-weight="700" letter-spacing="0.5">SpecOS 三档 Spec 模式</text>
  <text x="60" y="92" fill="#7c8a97" font-size="14">按团队规模与治理成本递增 — LiteSpec → GoalSpec → EnterpriseSpec</text>

  <!-- staircase -->
  <g>
    <!-- LiteSpec step -->
    <rect x="120" y="420" width="280" height="120" fill="url(#stepLite)" rx="6"/>
    <text x="260" y="400" fill="#5fd0c0" font-size="15" text-anchor="middle" letter-spacing="1">STEP 01</text>
    <text x="260" y="475" fill="#0f1720" font-size="24" font-weight="700" text-anchor="middle">LiteSpec</text>
    <text x="260" y="500" fill="#0f1720" font-size="13" text-anchor="middle" opacity="0.75">Feature Driven</text>

    <!-- GoalSpec step -->
    <rect x="460" y="300" width="280" height="240" fill="url(#stepGoal)" rx="6"/>
    <text x="600" y="280" fill="#e8a94c" font-size="15" text-anchor="middle" letter-spacing="1">STEP 02</text>
    <text x="600" y="360" fill="#0f1720" font-size="24" font-weight="700" text-anchor="middle">GoalSpec</text>
    <text x="600" y="386" fill="#0f1720" font-size="13" text-anchor="middle" opacity="0.75">Workflow Driven</text>

    <!-- EnterpriseSpec step -->
    <rect x="800" y="140" width="280" height="400" fill="url(#stepPro)" rx="6"/>
    <text x="940" y="120" fill="#d97a7a" font-size="15" text-anchor="middle" letter-spacing="1">STEP 03</text>
    <text x="940" y="200" fill="#0f1720" font-size="24" font-weight="700" text-anchor="middle">EnterpriseSpec</text>
    <text x="940" y="226" fill="#0f1720" font-size="13" text-anchor="middle" opacity="0.75">Delivery Driven</text>
  </g>

  <!-- annotations under each step -->
  <g font-size="12.5" fill="#cfd8de">
    <text x="260" y="565">一个 feature 一份 spec</text>
    <text x="260" y="583">token 成本最低</text>

    <text x="600" y="565">prd → to-issues → goal</text>
    <text x="600" y="583">→ review-it → ship-it 六步闭环</text>

    <text x="940" y="238">categorized QA / 发布证据</text>
    <text x="940" y="256">4 级 CI 门禁把关</text>
  </g>

  <!-- axis label -->
  <line x1="100" y1="560" x2="1120" y2="560" stroke="#3a4652" stroke-width="1"/>
  <text x="1120" y="600" fill="#7c8a97" font-size="13" text-anchor="end">团队规模 / 治理重量 →</text>
  <text x="100" y="600" fill="#7c8a97" font-size="13">个人 / 5人内团队</text>
</svg>
