id: default-fullstack
name: Default Fullstack
inputs:
  - .requirements
outputs:
  - .requirements
gates:
  - PRD accepted by human
  - design updated or confirmed
  - child Spec generated in the Requirement Package
  - child Spec reviewed and approved by human
  - independent Test Design generated from the approved child Spec
  - Test Design reviewed and approved by the testing owner
  - implementation and verification Issues generated as separate tracks
  - implementation handoff prepared
  - focused implementation validation completed
  - independent Test Design scenarios executed
  - report reviewed
  - ci gate passed
