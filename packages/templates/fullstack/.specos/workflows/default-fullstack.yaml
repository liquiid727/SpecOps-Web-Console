id: default-fullstack
name: Default Fullstack
inputs:
  - .requirements
outputs:
  - .requirements
  - tests
gates:
  - PRD accepted by human
  - design updated or confirmed
  - Spec and Test recorded in the Requirement Package
  - Issues generated in the Requirement Package
  - implementation handoff prepared
  - test plan reviewed by human
  - tests generated
  - tests executed
  - report reviewed
  - ci gate passed
