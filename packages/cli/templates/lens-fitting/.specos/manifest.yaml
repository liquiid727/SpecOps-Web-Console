project:
  name: lens-fitting-specos
  type: fullstack
projectMode: goalspec
stacks:
  frontend: mini-program-next
  backend: node-api
artifacts:
  draftsDir: .prd
  issuesDir: .issues
  specsDir: .features
  testsDir: tests
  resultsDir: tests/results
rulePacks:
  - spec-driven-delivery
  - product-architecture-baseline
agentTemplates:
  - product-architect-agent
  - spec-editor
  - frontend-agent
  - backend-agent
  - qa-agent
  - ci-editor
  - reviewer
workflows:
  - lens-fitting-spec-chain
ci:
  checkCommand: npx specos check
