id: lens-fitting-spec-chain
name: Lens Fitting Spec Chain
inputs:
  - .prd/idea/lens-fitting-idea.md
outputs:
  - .features/current/lens-fitting.spec.yaml
  - .features/changes/lens-fitting-mvp/
  - .issues/task-graph.yaml
  - .issues/lens-fitting-mvp.issues.md
  - tests/plans/lens-fitting-mvp.test-plan.json
  - deploy/environments.md
gates:
  - idea accepted by human
  - spec branches reviewed
  - task graph reviewed
  - code handoff accepted
  - test plan reviewed
  - deploy gate reviewed
