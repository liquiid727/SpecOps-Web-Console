changeId: lens-fitting-mvp
sourceDraft: .prd/idea/lens-fitting-idea.md
status: draft-change
chain:
  - Idea
  - Spec
  - Task
  - Code
  - Test
  - Deploy
specBranches:
  product:.features/current/product/product.md
  architecture:.features/current/architecture/architecture.md
  database:.features/current/database/database.md
  api:.features/current/api/api.md
  ui:.features/current/ui/ui.md
handoff:
  specEditor: normalize this blueprint into an executable change package
stagePolicy:
  ideaToSpec: product-architect-agent drafts the blueprint, then spec-editor normalizes it
  specToTask: derive executable epics, stories, and issues from Product, Architecture, Database, API, and UI branches
  taskToCode: invoke frontend-agent and backend-agent only when execution starts
  codeToTest: invoke qa-agent after code handoff is ready for verification
  testToDeploy: invoke ci-editor after QA evidence is ready for release gating
specialistPolicy:
  frontend: frontend-agent may load ui-design-agent and playwright-test-agent when needed
  backend: backend-agent may load ddd-domain-agent, openapi-agent, db-migration-agent, bruno-test-agent, performance-test-agent, and concurrency-test-agent when needed
  qa: qa-agent may load test-editor, unit-test-agent, bruno-test-agent, e2e-test-agent, playwright-test-agent, performance-test-agent, concurrency-test-agent, and specialized-check-agent when needed
