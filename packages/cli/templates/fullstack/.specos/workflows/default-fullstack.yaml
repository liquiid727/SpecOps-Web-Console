id: default-fullstack
name: Default Fullstack
inputs:
  - .prd
outputs:
  - .features
  - .issues
  - implementation
  - reviews
  - tests
gates:
  - PRD accepted by human
  - design updated or confirmed
  - Feature Spec and Test Spec recorded in .features
  - implementation and verification Issues generated in .issues
  - implementation handoff prepared
  - test plan reviewed by human
  - tests generated
  - tests executed
  - report reviewed
  - ci gate passed
