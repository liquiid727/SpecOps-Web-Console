name: Tauri Desktop Build

# Verifies the real Tauri v2 desktop integration compiles and bundles on both
# supported platforms. macOS is also verified locally (cargo build); this
# workflow provides the Windows CI build verification required by Issue #9
# because Windows cannot be verified on the macOS dev machine.

on:
  workflow_dispatch:
  push:
    tags:
      - "cli-gui-v*"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target universal-apple-darwin"
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cli-gui/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system dependencies (skipped on mac/win)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        working-directory: cli-gui
        run: npm ci

      - name: Build frontend
        working-directory: cli-gui
        run: npm run build

      - name: Generate Tauri icons (idempotent)
        working-directory: cli-gui
        run: node scripts/gen-tauri-icons.mjs

      - name: Tauri build (macOS / Windows)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: cli-gui
          args: ${{ matrix.args }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cli-gui-bundle-${{ matrix.platform }}
          path: |
            cli-gui/src-tauri/target/*/release/bundle/**/*
          if-no-files-found: ignore
