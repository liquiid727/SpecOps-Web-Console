[package]
name = "product-ai-os-cli-gui"
version = "0.1.0"
description = "Product AI OS CLI GUI desktop shell"
authors = ["Product AI OS"]
edition = "2021"
rust-version = "1.77.2"

# The desktop binary and the shared library keep the same crate name so the
# mobile-ready `run()` entrypoint can be reused across targets.
[lib]
name = "product_ai_os_cli_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"

[features]
# Enabled by `tauri dev`/`tauri build` for debug tooling.
custom-protocol = ["tauri/custom-protocol"]
