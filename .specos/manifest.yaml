project:
  name: specos-fullstack
  type: fullstack
schemaVersion: specos/goalspec
stacks:
  frontend: next
  backend: node-api
artifacts:
  requirementsDir: .requirements/requirements
  templatesDir: .requirements/templates
rulePacks:
  - spec-driven-delivery
agentTemplates:
  - product-architect-agent
  - spec-editor
  - frontend-agent
  - backend-agent
  - testing-agent
  - qa-agent
  - ci-editor
  - reviewer
workflows:
  - default-fullstack
ci:
  checkCommand: npx specos check
