project:
  name: specos-fullstack
  type: fullstack
stacks:
  frontend: next
  backend: node-api
artifacts:
  # Single source of truth for spec artifact locations.
  # Resolution order for skills: explicit user request > this manifest >
  # legacy convention detection (spec-draft/, specs/) > built-in defaults.
  draftsDir: .prd
  specsDir: .features
  issuesDir: .issues
  testsDir: tests
  resultsDir: tests/results
rulePacks:
  - spec-driven-delivery
agentTemplates:
  - product-architect-agent
  - spec-editor
  - frontend-agent
  - backend-agent
  - testing-agent
  - qa-agent
  - ci-editor
  - reviewer
workflows:
  - default-fullstack
ci:
  checkCommand: npx specos check
