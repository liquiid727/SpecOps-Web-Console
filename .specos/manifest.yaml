project:
  name: specos-fullstack
  type: fullstack
projectMode: goalspec
stacks:
  frontend: next
  backend: node-api
artifacts:
  draftsDir: .requirements
  specsDir: .requirements
  issuesDir: .requirements
  testsDir: .requirements
  resultsDir: .requirements
rulePacks:
  - spec-driven-delivery
agentTemplates:
  - product-architect-agent
  - spec-editor
  - frontend-agent
  - backend-agent
  - testing-agent
  - qa-agent
  - ci-editor
  - reviewer
workflows:
  - default-fullstack
ci:
  checkCommand: npx specos check
