workflow: test-console-v1
purpose: SpecOS Contract -> task plan -> execution -> normalized result -> report ui

inputs:
  - specos_contract
  - spec_id
  - spec_version
  - run_scope

steps:
  - derive_test_plan
  - generate_api_and_scenario_assets
  - run_selected_tests
  - normalize_results
  - publish_to_test_console

outputs:
  - tests/plans/<spec>.test-plan.json
  - tests/results/<spec>.<run_id>.json
  - test-console overview and detail pages

gates:
  - specos_contract_required
  - normalized_result_required
  - release_decision_visible
