version: 1
project: specos-ai

default_entrypoint:
  - .rules/project.md
  - AGENTS.md

work_types:
  backend:
    rules:
      - rules/backend/go-backend-governance.md
      - rules/backend/redis-key-governance.md
      - rules/shared/error-code-governance.md
    agents:
      - ddd-domain-agent
      - openapi-agent
      - db-migration-agent
      - bruno-test-agent

  frontend:
    rules:
      - rules/frontend/react-workbench-delivery.md
      - rules/shared/error-code-governance.md
    agents:
      - ui-design-agent
      - playwright-test-agent
      - test-editor

  ui_prototype:
    rules:
      - rules/ui/pencil-prototype-ui.md
      - rules/frontend/react-workbench-delivery.md
    agents:
      - spec-editor
      - playwright-test-agent

  spec:
    rules:
      - specs/_rules/README.md
      - rules/testing/production-test-standards.md
      - rules/shared/error-code-governance.md
    agents:
      - spec-editor
      - ddd-domain-agent
      - test-editor

  tests:
    rules:
      - tests/README.md
      - rules/testing/production-test-standards.md
      - rules/ci/spec-release-gates.md
    agents:
      - test-editor
      - bruno-test-agent
      - playwright-test-agent
      - qa-agent

  ci:
    rules:
      - rules/testing/production-test-standards.md
      - rules/ci/spec-release-gates.md
      - scripts/checks/README.md
    agents:
      - ci-editor
      - execution-editor
      - qa-agent

  orchestration:
    rules:
      - ai/workflows/README.md
      - scripts/orchestration/README.md
      - rules/ci/spec-release-gates.md
    agents:
      - execution-editor
      - ci-editor
      - qa-agent
      - reviewer
